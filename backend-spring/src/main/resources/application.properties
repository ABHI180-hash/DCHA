# ==========================================
# DCHA - SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dcha_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE SETTINGS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT SECURITY SETTINGS
# ==========================================
jwt.secret=${JWT_SECRET:DCHA_CULTURE_HERITAGE_ARCHIVE_JWT_SECRET_KEY_MINIMUM_256_BITS_LONG_SECURITY_TOKEN_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# AI PROVIDER - GOOGLE GEMINI
# ==========================================
ai.api-key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
ai.model=${AI_MODEL:${GEMINI_MODEL:gemini-1.5-flash}}

# ==========================================
# CORS ALLOWED ORIGINS
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.dcha=DEBUG